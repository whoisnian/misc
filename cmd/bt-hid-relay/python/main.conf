# bt-hid 专用 BlueZ 配置，通过 `bluetoothd -f <此文件>` 加载，不影响 /etc/bluetooth/main.conf
[General]
Name = Linux HID Relay
# Class of Device: major 0x05 (Peripheral), minor 0x30 (键盘+指点设备组合)
Class = 0x0005C0
# 0 = 由 relay.py 通过 D-Bus 控制可发现/可配对的超时
DiscoverableTimeout = 0
PairableTimeout = 0
# 允许 Windows 侧“删除设备”后直接重新配对，无需在 Linux 侧手动 remove
JustWorksRepairing = always
# PnP (Device ID) 记录，Windows 识别设备时会读取；1d6b = Linux Foundation
DeviceID = bluetooth:1d6b:0246:0537

[Policy]
AutoEnable = true
